/* ===== Elegant Kids UI ===== */
:root{
  --ink:#34415c;
  --muted:#7c879c;
  --card:#fffdfb;
  --line:#e9e7ee;
  --shadow:0 14px 35px rgba(52,65,92,.10);
  --shadow2:0 7px 18px rgba(52,65,92,.08);
}
body{
  background:
    radial-gradient(circle at 8% 8%,rgba(255,255,255,.9) 0 8%,transparent 9%),
    radial-gradient(circle at 92% 12%,rgba(255,255,255,.7) 0 7%,transparent 8%),
    linear-gradient(135deg,var(--a),var(--b));
}
header{
  padding:24px 18px 22px!important;
  border-bottom:1px solid rgba(255,255,255,.9);
  box-shadow:0 6px 20px rgba(52,65,92,.06);
}

  font-size:34px!important;
  letter-spacing:-.7px;
  color:#33405b;
}

.theme{
  max-width:1100px!important;
  margin:14px auto!important;
  border:1px solid rgba(255,255,255,.9);
  box-shadow:var(--shadow2);
  color:#5c6880;
}
.theme select{
  min-width:220px;
  background:#fff;
}
.card{
  background:rgba(255,253,251,.96)!important;
  border:1px solid rgba(233,231,238,.8);
  box-shadow:var(--shadow)!important;
}
.choice{
  position:relative;
  overflow:hidden;
  border:1px solid var(--line)!important;
  border-radius:22px!important;

#topicGrid .choice:nth-child(3n+1) .big{background:linear-gradient(145deg,#e9f7f2,#e8f1ff)}

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const subjectLabels={
    "Math":"Numbers • Logic • Problem Solving",
    "English":"Words • Grammar • Reading",
    "General Knowledge":"World • India • Discovery",
    "Science":"Nature • Space • Experiments",
    "Reasoning":"Patterns • Logic • Thinking"
  };
  const observer=new MutationObserver(()=>{
    document.querySelectorAll("#subjects .choice").forEach((c)=>{
      const name=c.textContent.trim().split("\n")[0];
      if(subjectLabels[name] && !c.dataset.enhanced){
        const s=document.createElement("div");
        s.textContent=subjectLabels[name];
        s.style.cssText="color:#8993a6;font-size:12px;font-weight:700;margin-top:5px;line-height:1.3";
        c.appendChild(s); c.dataset.enhanced="1";
      }
    });
  });
  observer.observe(document.getElementById("subjects"),{childList:true});
});
</script>

<script>
(function(){
  const themeIcons={
    space:["✦","✧","★","·"],
    jungle:["🍃","🌿","✿","·"],
    ocean:["•","○","◦","💧"],
    fairy:["✦","✧","♡","·"],
    robot:["⚙","·","◦","▣"],
    mountain:["❄","✦","·","◆"]
  };
  function setThemeAnimation(name){
    document.body.className=document.body.className.replace(/\btheme-\w+\b/g,"").trim();
    document.body.classList.add("theme-"+name);
    let layer=document.querySelector(".theme-particles");
    if(!layer){
      layer=document.createElement("div");
      layer.className="theme-particles";
      document.body.prepend(layer);
    }
    layer.innerHTML="";
    const icons=themeIcons[name]||themeIcons.space;
    for(let i=0;i<18;i++){
      const p=document.createElement("span");
      p.className="theme-particle";
      p.textContent=icons[i%icons.length];
      p.style.left=(Math.random()*100)+"%";
      p.style.fontSize=(10+Math.random()*15)+"px";
      p.style.animationDuration=(9+Math.random()*11)+"s";
      p.style.animationDelay=(-Math.random()*18)+"s";
      p.style.setProperty("--dx",(-80+Math.random()*160)+"px");
      layer.appendChild(p);
    }
  }
  const oldTheme=window.theme;
  window.theme=function(k){
    oldTheme(k);
    setThemeAnimation(k);
  };
  window.addEventListener("DOMContentLoaded",()=>{
    const k=localStorage.t||"space";
    setThemeAnimation(k);
  });
})();
</script>

<script>
(function(){
  function wireLibraryNav(){
    document.querySelectorAll(".lib-tab").forEach(btn=>{
      btn.onclick=()=>{
        document.querySelectorAll(".lib-tab").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        if(typeof choose==="function") choose(btn.dataset.subject);
      };
    });
  }
  document.addEventListener("DOMContentLoaded",wireLibraryNav);
  const oldChoose=window.choose;
  if(oldChoose){
    window.choose=function(s){
      oldChoose(s);
      document.querySelectorAll(".lib-tab").forEach(x=>x.classList.toggle("active",x.dataset.subject===s));
    };
  }
})();
</script>
<script>
(function(){
let answered=0,correct=0,streak=0,results=[];

function draw(){
 const a=document.getElementById("assessAnswered");
 if(!a)return;

 a.textContent=answered;
 const pct=answered?Math.round(correct/answered*100):0;
 const acc=document.getElementById("assessAccuracy");
 const ring=document.getElementById("accuracyRing");
 const levelEl=document.getElementById("assessLevel");
 const streakEl=document.getElementById("assessStreak");
 const text=document.getElementById("assessAccuracyText");

 if(acc)acc.textContent=pct+"%";
 if(ring)ring.style.background="conic-gradient(#55c97a "+pct+"%,#e9edf2 "+pct+"% 100%)";
 if(levelEl)levelEl.textContent="Level "+(typeof level==="number"?level:1);
 if(streakEl)streakEl.textContent=streak;
 if(text)text.textContent=pct>=90?"Amazing! 🌟":pct>=75?"Great job! ⭐":pct>=50?"Keep going! 💪":"Let's learn together! 🌱";

 const t=document.getElementById("questionTrack");
 if(!t)return;
 t.innerHTML="";

 for(let n=1;n<=15;n++){
   if(n>1){
     const line=document.createElement("div");
     line.className="track-line";
     t.appendChild(line);
   }

   const d=document.createElement("div");
   d.className="track-dot";

   // A question's final submitted result controls its colour:
   // green = correct, red = incorrect, blue = current, grey = unanswered.
   if(results[n-1] === true){
      d.classList.add("done");
   }else if(results[n-1] === false){
      d.classList.add("incorrect");
   }else if(n === answered+1){
      d.classList.add("current");
   }

   d.textContent=n;
   d.title = results[n-1]===false ? "Incorrect answer" :
             results[n-1]===true ? "Correct answer" :
             n===answered+1 ? "Current question" : "Not answered";
   t.appendChild(d);
 }
}

window.resetAssessment=function(){
  answered=0;
  correct=0;
  streak=0;
  results=[];
  draw();
};

document.addEventListener("DOMContentLoaded",()=>{
  draw();

  const submit=document.getElementById("submit");
  if(!submit)return;

  submit.addEventListener("click",()=>{
    if(submit.classList.contains("hidden"))return;

    const opts=[...document.querySelectorAll(".option")];
    const chosen=opts.findIndex(x=>x.classList.contains("sel"));
    if(chosen<0)return;

    if(typeof DATA==="undefined" ||
       typeof subject==="undefined" ||
       typeof topic==="undefined" ||
       typeof i==="undefined") return;

    const q=DATA.questions[subject][topic][i];
    if(!q)return;

    const ok=chosen===q.a;

    // Record the result against THIS question number.
    results[i]=ok;
    answered=Math.max(answered,i+1);

    if(ok){
      correct++;
      streak++;
    }else{
      streak=0;
    }

    draw();
  },true);
});
})();
</script>
