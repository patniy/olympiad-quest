<!doctype html><html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c63ff"><link rel="manifest" href="manifest.json"><title>Olympiad Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6ff;color:#26324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:820px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#e9e5ff,#e5f7ff);border-radius:28px;padding:22px;text-align:center}h1{margin:0;font-size:clamp(32px,8vw,48px)}.sub{color:#5f6980;margin:6px 0 15px}.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.pill{background:#fff;padding:9px 14px;border-radius:99px;font-weight:800}.card{background:#fff;border-radius:24px;padding:20px;margin-top:15px;box-shadow:0 4px 18px #1d294012}.subjects{display:flex;gap:8px;flex-wrap:wrap}.subject{border:0;border-radius:99px;padding:10px 14px;background:#eeeaff;font-weight:750}.progress{height:9px;background:#e7e9f1;border-radius:9px;overflow:hidden;margin:15px 0}.bar{height:100%;width:0;background:#6c63ff;transition:.25s}.question{font-size:clamp(23px,5vw,31px);font-weight:800;line-height:1.35;margin:18px 0}.option{width:100%;text-align:left;margin:7px 0;min-height:58px;padding:12px;border:2px solid #e2e6ef;border-radius:15px;background:#fff;font-size:18px;font-weight:750}.option.correct{background:#eaf8f1;border-color:#168a5b}.option.wrong{background:#fff0f2;border-color:#d94a5a}.next{width:100%;margin-top:12px;min-height:54px;border:0;border-radius:15px;background:#6c63ff;color:#fff;font-size:18px;font-weight:800}.feedback{margin-top:13px;padding:14px;border-radius:16px;background:#f0f1ff;font-size:17px;line-height:1.45}.small{font-size:14px;color:#6c7589}.hide{display:none}.level{font-weight:900;color:#554dd1}
</style></head><body><main>
<section class="hero"><div class="small">STARTING AGE 5 • ADAPTIVE OLYMPIAD TRAINING</div><h1>🌟 Olympiad Quest</h1><div class="sub">Get it right → challenge rises. Miss it → we step down and teach.</div>
<div class="stats"><span class="pill">⭐ <span id="stars">0</span></span><span class="pill">🧠 Level <span id="level">1</span></span><span class="pill">🔥 <span id="streak">0</span></span><span class="pill">🎯 <span id="accuracy">0%</span></span></div></section>
<section class="card"><div class="subjects" id="subjects"></div><div class="small" style="margin-top:14px">Adaptive level <b class="level" id="difficulty">1</b> • Question <b id="number">1</b></div><div class="progress"><div class="bar" id="bar"></div></div><div class="question" id="question"></div><div id="options"></div><div class="feedback hide" id="feedback"></div><button class="next hide" id="next">Next Question →</button></section>
</main><script src="questions.js"></script><script>
const ICON={Math:"🔢",Science:"🔬",English:"🔤",GK:"🌍",Reasoning:"🧩",Mixed:"🏆"};
let topic="Mixed",difficulty=1,quizIndex=0,score=0,stars=0,streak=0,attempts=0,correctTotal=0,locked=false;
const $=x=>document.getElementById(x);
function stats(){ $("stars").textContent=stars;$("streak").textContent=streak;$("level").textContent=difficulty;$("difficulty").textContent=difficulty;$("accuracy").textContent=attempts?Math.round(correctTotal/attempts*100)+"%":"0%" }
function pool(){return QUESTIONS.filter(q=>(topic==="Mixed"||q.s===topic)&&q.d===difficulty)}
function pick(){let p=pool();if(!p.length)p=QUESTIONS.filter(q=>topic==="Mixed"||q.s===topic);return p[Math.floor(Math.random()*p.length)]}
function render(){locked=false;let q=pick();$("number").textContent=quizIndex+1;$("bar").style.width=Math.min(100,((quizIndex%10)/9)*100)+"%";$("question").textContent=q.q;$("feedback").classList.add("hide");$("next").classList.add("hide");$("options").innerHTML="";
q.o.forEach((x,j)=>{let b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+x;b.onclick=()=>answer(j,q,b);$("options").appendChild(b)})}
function answer(choice,q){if(locked)return;locked=true;attempts++;let ok=choice===q.a;document.querySelectorAll(".option").forEach((b,j)=>{if(j===q.a)b.classList.add("correct");if(j===choice&&!ok)b.classList.add("wrong")});
if(ok){score++;correctTotal++;stars+=2;streak++;difficulty=Math.min(10,difficulty+1);$("feedback").innerHTML="<b>🌟 Correct!</b><br>"+q.e+"<br><b>Next challenge: Level "+difficulty+"</b>"}else{streak=0;difficulty=Math.max(1,difficulty-1);$("feedback").innerHTML="<b>💡 Good try!</b><br>Correct answer: <b>"+q.o[q.a]+"</b><br>"+q.e+"<br><b>We’ll step down to Level "+difficulty+" and build you back up.</b>"}quizIndex++;$("feedback").classList.remove("hide");$("next").classList.remove("hide");stats()}
$("next").onclick=()=>render();
function start(t){topic=t;difficulty=1;quizIndex=0;score=0;render();stats()}
["Mixed","Math","Science","English","GK","Reasoning"].forEach(s=>{let b=document.createElement("button");b.className="subject";b.textContent=ICON[s]+" "+s;b.onclick=()=>start(s);$("subjects").appendChild(b)});
start("Mixed");
</script></body></html>
