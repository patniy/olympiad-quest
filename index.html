/* ===== Elegant Kids UI ===== */
:root{

}
body{

}

}

<script>
document.addEventListener("DOMContentLoaded",()=>{
  const subjectLabels={
    "Math":"Numbers • Logic • Problem Solving",
    "English":"Words • Grammar • Reading",
    "General Knowledge":"World • India • Discovery",
    "Science":"Nature • Space • Experiments",
    "Reasoning":"Patterns • Logic • Thinking"
  };
  const observer=new MutationObserver(()=>{
    document.querySelectorAll("#subjects .choice").forEach((c)=>{
      const name=c.textContent.trim().split("\n")[0];
      if(subjectLabels[name] && !c.dataset.enhanced){
        const s=document.createElement("div");
        s.textContent=subjectLabels[name];

        c.appendChild(s); c.dataset.enhanced="1";
      }
    });
  });
  observer.observe(document.getElementById("subjects"),{childList:true});
});
</script>

<script>
(function(){
  const themeIcons={
    space:["✦","✧","★","·"],
    jungle:["🍃","🌿","✿","·"],
    ocean:["•","○","◦","💧"],
    fairy:["✦","✧","♡","·"],
    robot:["⚙","·","◦","▣"],
    mountain:["❄","✦","·","◆"]
  };
  function setThemeAnimation(name){
    document.body.className=document.body.className.replace(/\btheme-\w+\b/g,"").trim();
    document.body.classList.add("theme-"+name);
    let layer=document.querySelector(".theme-particles");
    if(!layer){
      layer=document.createElement("div");
      layer.className="theme-particles";
      document.body.prepend(layer);
    }
    layer.innerHTML="";
    const icons=themeIcons[name]||themeIcons.space;
    for(let i=0;i<18;i++){
      const p=document.createElement("span");
      p.className="theme-particle";
      p.textContent=icons[i%icons.length];
      p.style.left=(Math.random()*100)+"%";
      p.style.fontSize=(10+Math.random()*15)+"px";
      p.style.animationDuration=(9+Math.random()*11)+"s";
      p.style.animationDelay=(-Math.random()*18)+"s";
      p.style.setProperty("--dx",(-80+Math.random()*160)+"px");
      layer.appendChild(p);
    }
  }
  const oldTheme=window.theme;
  window.theme=function(k){
    oldTheme(k);
    setThemeAnimation(k);
  };
  window.addEventListener("DOMContentLoaded",()=>{
    const k=localStorage.t||"space";
    setThemeAnimation(k);
  });
})();
</script>

<script>
(function(){
  function wireLibraryNav(){
    document.querySelectorAll(".lib-tab").forEach(btn=>{
      btn.onclick=()=>{
        document.querySelectorAll(".lib-tab").forEach(x=>x.classList.remove("active"));
        btn.classList.add("active");
        if(typeof choose==="function") choose(btn.dataset.subject);
      };
    });
  }
  document.addEventListener("DOMContentLoaded",wireLibraryNav);
  const oldChoose=window.choose;
  if(oldChoose){
    window.choose=function(s){
      oldChoose(s);
      document.querySelectorAll(".lib-tab").forEach(x=>x.classList.toggle("active",x.dataset.subject===s));
    };
  }
})();
</script>
<script>
(function(){
let answered=0,correct=0,streak=0;
function draw(){
 const a=document.getElementById("assessAnswered"); if(!a)return;
 a.textContent=answered;
 const pct=answered?Math.round(correct/answered*100):0;
 document.getElementById("assessAccuracy").textContent=pct+"%";
 document.getElementById("accuracyRing").style.background="conic-gradient(#55c97a "+pct+"%,#e9edf2 "+pct+"% 100%)";
 document.getElementById("assessLevel").textContent="Level "+(typeof level==="number"?level:1);

 document.getElementById("assessAccuracyText").textContent=pct>=90?"Amazing! 🌟":pct>=75?"Great job! ⭐":pct>=50?"Keep going! 💪":"Let's learn together! 🌱";
 const t=document.getElementById("questionTrack");t.innerHTML="";
 for(let n=1;n<=15;n++){
  if(n>1){let l=document.createElement("div");l.className="track-line";t.appendChild(l)}
  let d=document.createElement("div");d.className="track-dot"+(n<=answered?" done":"")+(n===answered+1?" current":"");d.textContent=n;t.appendChild(d)
 }
}
window.setAssessment=function(a,c,s){answered=a;correct=c;streak=s;draw()};
window.resetAssessment=function(){answered=0;correct=0;streak=0;draw()};
document.addEventListener("DOMContentLoaded",()=>{
 draw();
 const submit=document.getElementById("submit");
 if(submit) submit.addEventListener("click",()=>{
   if(submit.classList.contains("hidden"))return;
   const opts=[...document.querySelectorAll(".option")], chosen=opts.findIndex(x=>x.classList.contains("sel"));

     const q=DATA.questions[subject][topic][i]; answered++; if(chosen===q.a){correct++;streak++}else streak=0; draw();
   }
 },true);
});
})();
