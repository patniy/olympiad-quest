<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6c63ff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<title>Olympiad Quest</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f7ff;color:#26324a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
main{max-width:820px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,#e9e5ff,#e5f7ff);border-radius:28px;padding:22px;text-align:center}
h1{margin:0;font-size:clamp(32px,8vw,48px)}.sub{margin:6px 0 15px;color:#5f6980}
.stats{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.pill{background:white;padding:9px 14px;border-radius:99px;font-weight:800}
.card{background:white;border-radius:24px;padding:20px;margin-top:15px;box-shadow:0 4px 18px #1d294012}
.subjects{display:flex;gap:8px;flex-wrap:wrap}.subject{border:0;border-radius:99px;padding:10px 14px;background:#eeeaff;font-weight:750}
.progress{height:9px;background:#e7e9f1;border-radius:9px;overflow:hidden;margin:15px 0}.bar{height:100%;width:0;background:#6c63ff}
.question{font-size:clamp(23px,5vw,31px);font-weight:800;line-height:1.35;margin:18px 0}
.option{width:100%;text-align:left;margin:7px 0;min-height:58px;padding:12px;border:2px solid #e2e6ef;border-radius:15px;background:#fff;font-size:18px;font-weight:750}
.option.correct{background:#eaf8f1;border-color:#168a5b}.option.wrong{background:#fff0f2;border-color:#d94a5a}
.next{width:100%;margin-top:12px;min-height:54px;border:0;border-radius:15px;background:#6c63ff;color:white;font-size:18px;font-weight:800}
.feedback{margin-top:13px;padding:14px;border-radius:16px;background:#f0f1ff;font-size:17px;line-height:1.45}
.small{font-size:14px;color:#6c7589}.hide{display:none}
</style>
</head>
<body>
<main>
<section class="hero">
<div class="small">AGE 7 • OLYMPIAD TRAINING</div>
<h1>🌟 Olympiad Quest</h1>
<div class="sub">Think • Solve • Learn • Earn Stars!</div>
<div class="stats">
<span class="pill">⭐ <span id="stars">0</span></span>
<span class="pill">🏆 Level <span id="level">1</span></span>
<span class="pill">🔥 <span id="streak">0</span></span>
<span class="pill">🎯 <span id="accuracy">0%</span></span>
</div>
</section>

<section class="card">
<div class="subjects" id="subjects"></div>
<div class="small" style="margin-top:14px">Question <b id="number">1</b> of <b id="total">10</b></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<div class="question" id="question"></div>
<div id="options"></div>
<div class="feedback hide" id="feedback" aria-live="polite"></div>
<button class="next hide" id="next">Next Question →</button>
</section>
</main>
<script src="questions.js"></script>
<script>
const ICON={Math:"🔢",Science:"🔬",English:"🔤",GK:"🌍",Reasoning:"🧩",Mixed:"🏆"};
let topic="Mixed",quiz=[],i=0,score=0,stars=0,streak=0,attempts=0,correctTotal=0,locked=false;
const $=x=>document.getElementById(x);
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function stats(){ $("stars").textContent=stars; $("streak").textContent=streak; $("level").textContent=Math.floor(stars/10)+1; $("accuracy").textContent=attempts?Math.round(correctTotal/attempts*100)+"%":"0%" }
function start(t){
 topic=t;
 const pool=t==="Mixed"?QUESTIONS:QUESTIONS.filter(q=>q.s===t);
 quiz=shuffle(pool).slice(0,Math.min(10,pool.length)); i=0; score=0; render();
}
function render(){
 locked=false; const q=quiz[i];
 $("number").textContent=i+1; $("total").textContent=quiz.length;
 $("bar").style.width=(i/quiz.length*100)+"%"; $("question").textContent=q.q;
 $("feedback").classList.add("hide"); $("next").classList.add("hide"); $("options").innerHTML="";
 q.o.forEach((text,j)=>{const b=document.createElement("button");b.className="option";b.textContent=String.fromCharCode(65+j)+". "+text;b.addEventListener("click",()=>answer(j));$("options").appendChild(b)})
}
function answer(choice){
 if(locked)return; locked=true; attempts++;
 const q=quiz[i], ok=choice===q.a;
 document.querySelectorAll(".option").forEach((b,j)=>{if(j===q.a)b.classList.add("correct");if(j===choice&&!ok)b.classList.add("wrong")});
 if(ok){score++;correctTotal++;stars+=2;streak++;$("feedback").innerHTML="<b>🌟 Correct!</b><br>"+q.e}
 else{streak=0;$("feedback").innerHTML="<b>💡 Good try!</b><br>The correct answer is <b>"+q.o[q.a]+"</b>.<br>"+q.e}
 $("feedback").classList.remove("hide");$("next").classList.remove("hide");stats();
}
$("next").addEventListener("click",()=>{
 i++;
 if(i<quiz.length){$("next").textContent="Next Question →";render()}
 else{
  const pct=Math.round(score/quiz.length*100);
  $("question").textContent="🎉 Round Complete!";
  $("options").innerHTML="<h2>"+score+" / "+quiz.length+" correct</h2><p>"+pct+"% — "+(pct>=80?"🏆 Champion thinking!":pct>=60?"🌟 Great work!":"💪 Keep practising!")+"</p>";
  $("feedback").classList.add("hide"); $("next").textContent="Play Again"; $("next").classList.remove("hide");
  $("next").onclick=()=>{ $("next").onclick=null; $("next").textContent="Next Question →"; start(topic); };
 }
});
["Mixed","Math","Science","English","GK","Reasoning"].forEach(s=>{const b=document.createElement("button");b.className="subject";b.textContent=ICON[s]+" "+s;b.addEventListener("click",()=>start(s));$("subjects").appendChild(b)});
stats();start("Mixed");
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"))}
</script>
</body>
</html>
